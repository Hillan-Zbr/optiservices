server {
    listen 80;
    server_name _;
    client_max_body_size 5m;

    root /usr/share/nginx/html;
    index index.html;

    # Envoie l'origine du site aux serveurs de tuiles (exigé par la politique d'usage OSM)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Application web
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Optimiseur de tournées
    location /vroom/ {
        proxy_pass http://vroom:3000/;
        proxy_read_timeout 300s;
    }

    # Moteur de routage (test trajet)
    location /osrm/ {
        proxy_pass http://osrm:5000/;
    }

    # Géocodage BAN via la Géoplateforme IGN (seules l'adresse, le CP et la ville sont envoyés)
    location /geocode/ {
        resolver 127.0.0.11 valid=300s ipv6=off;   # DNS interne de Docker
        set $geo_host data.geopf.fr;
        rewrite ^/geocode/(.*)$ /geocodage/$1 break;
        proxy_pass https://$geo_host;
        proxy_set_header Host data.geopf.fr;
        proxy_ssl_server_name on;
        proxy_ssl_name data.geopf.fr;
    }
}
