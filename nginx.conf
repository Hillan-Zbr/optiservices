server {
    listen 80;
    server_name _;
    client_max_body_size 5m;

    root /usr/share/nginx/html;
    index index.html;

    # Envoie l'origine du site aux serveurs de tuiles (exigé par la politique d'usage OSM)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression : app.js et Leaflet passent d'environ 270 Ko à 70 Ko
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Application web
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Bibliothèques et polices : jamais modifiées sur place (une nouvelle version change de dossier)
    location /vendor/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Optimiseur de tournées
    location /vroom/ {
        proxy_pass http://vroom:3000/;
        proxy_read_timeout 300s;
    }

    # Moteur de routage (test trajet)
    location /osrm/ {
        proxy_pass http://osrm:5000/;
    }

    # Géocodage BAN via la Géoplateforme IGN (seules l'adresse, le CP et la ville sont envoyés)
    location /geocode/ {
        resolver 127.0.0.11 valid=300s ipv6=off;   # DNS interne de Docker
        set $geo_host data.geopf.fr;
        rewrite ^/geocode/(.*)$ /geocodage/$1 break;
        proxy_pass https://$geo_host;
        proxy_set_header Host data.geopf.fr;
        proxy_ssl_server_name on;
        proxy_ssl_name data.geopf.fr;
    }

    # MaJournée V2 (MJ2, en DMZ) : Optiservices pousse les tournées et les messages (contrat : docs/mj2-contrat.md).
    # Ce fichier est un modèle : l'image nginx remplace ${MJ2_URL} et ${MJ2_CLE} par les valeurs du .env au démarrage.
    # MJ2_URL = schéma://hôte[:port] sans chemin ; la clé d'API est ajoutée ici et n'apparaît jamais dans le navigateur.
    location /mj2/api/v1/ {
        resolver 127.0.0.11 valid=60s ipv6=off;   # DNS interne de Docker (relaie le DNS du LAN)
        set $mj2 "${MJ2_URL}";
        rewrite ^/mj2/(api/v1/.*)$ /$1 break;
        proxy_pass $mj2;
        proxy_set_header X-Api-Key "${MJ2_CLE}";
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
