services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: osrm-routed --algorithm mld --max-table-size 10000 /data/paca-corse.osrm
    volumes: [ "./osrm:/data" ]
    ports: [ "5000:5000" ]
    restart: unless-stopped

  vroom:
    image: ghcr.io/vroom-project/vroom-docker:v1.14.0
    environment:
      - VROOM_ROUTER=osrm
    volumes: [ "./vroom-conf:/conf" ]
    ports: [ "3000:3000" ]
    depends_on: [ osrm ]
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./web:/usr/share/nginx/html:ro
      # modèle : l'image nginx y remplace ${MJ2_URL} et ${MJ2_CLE} et l'écrit dans conf.d/default.conf
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      # MaJournée V2 : à renseigner dans le .env du serveur (jamais dans git). Sans valeur, /mj2/ répond 502.
      - MJ2_URL=${MJ2_URL:-http://mj2-non-configure.invalid}
      - MJ2_CLE=${MJ2_CLE:-}
    ports: [ "8080:80" ]
    depends_on: [ vroom, osrm ]
    restart: unless-stopped
